[project]
name = "infra-nix"
revision = "1.0"

[defaults]
providers = ["bw://?server=https://vault.garudalinux.org"]

[profiles.default]
GRAFANA_TOKEN = { description = "Personal Grafana service account token for the Garuda monitoring instance (gcx)" }
GRAFANA_SERVER = { description = "Garuda Grafana (gcx)", default = "http://monitoring:3010" }
GRAFANA_ORG_ID = { description = "Grafana org id (gcx)", default = "1" }
